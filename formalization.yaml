# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "ZetaH123"
  authors: [Kenny Lau]
  description: >
    `ZetaH123` is a formal proof of Thakur's hypotheses H1, H2 and H3 on power sums over
    $\mathbb{F}_q[t]$, from *Thakur's hypotheses on power sums of $\mathbb{F}_q[t]$*
    (arXiv:2606.16239). It proves Theorem 1.1 (H1 for prime fields), Theorem 1.3 (H2 for prime
    fields), Theorem 1.8 (H3 for any prime power), and Lemma 4.1, the monomial expansion of
    $S_d(k)$ they rest on. The Lean files were generated by AxiomProver, Axiom Math's in-house
    theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "Thakur's hypotheses on power sums of $\\mathbb{F}_q[t]$"
    authors: [Evan Chen, Ken Ono]
    id: "https://arxiv.org/abs/2606.16239"
    type: "article"
    location: "Theorem 1.1, Theorem 1.3, Theorem 1.8, Lemma 4.1"
    relationship: "formalizes"
    note: >
      Formalized in four runs, one per result, in the modules `H1`, `H2`, `H3` and `Lem41`.

classification:
  arxiv: [math.NT, math.CO]
  msc2020: [11M38, 11T55, 11G09]

status:
  scope: >
    Theorem 1.1 for every prime $q = p$ and all $d, k \ge 0$; Theorem 1.3 for every prime $q = p$,
    $d > 1$ and $k > 0$; Theorem 1.8 for every prime power $q = p^f$, $d \ge 1$ and $k > 0$; and
    Lemma 4.1 for every prime power. Lemma 4.1 is stated coefficientwise in
    $\mathbb{F}_q((1/t))$, which `problem.lean` explains is what captures the right-hand side as a
    formal sum of monomials with repetition.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "main_theorem"
    file: "H1/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-H1.json"
  - declaration: "main"
    file: "H2/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-H2.json"
  - declaration: "main_theorem"
    file: "H3/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-H3.json"
  - declaration: "main"
    file: "Lem41/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-Lem41.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `H1/problem.lean`, `H2/problem.lean`, `H3/problem.lean` and
    `Lem41/problem.lean` was checked against the source paper by an author of that paper.

alignment:
  statements:
    - source: "Thakur's hypotheses on power sums of $\\mathbb{F}_q[t]$ (Theorem 1.1)"
      lean: "main_theorem"
      module: "H1.solution"
      status: "Proved."
    - source: "Thakur's hypotheses on power sums of $\\mathbb{F}_q[t]$ (Theorem 1.3)"
      lean: "main"
      module: "H2.solution"
      status: "Proved, as unique minimality of the objective at $j = 0$."
    - source: "Thakur's hypotheses on power sums of $\\mathbb{F}_q[t]$ (Theorem 1.8)"
      lean: "main_theorem"
      module: "H3.solution"
      status: "Proved."
    - source: "Thakur's hypotheses on power sums of $\\mathbb{F}_q[t]$ (Lemma 4.1)"
      lean: "main"
      module: "Lem41.solution"
      status: "Proved, coefficientwise in $\\mathbb{F}_q((1/t))$."
